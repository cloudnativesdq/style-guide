<!-- @dsCard group="Colors" viewport="700x220" subtitle="Warning, danger, borders" name="Semantic Status" -->
<link rel="stylesheet" href="../styles.css"><div style="width:700px;padding:16px;background:var(--bg-page);display:flex;gap:8px;font-family:var(--font-body)">
<div style="flex:1;display:flex;flex-direction:column;gap:6px">
<div style="height:64px;border-radius:8px;background:var(--status-warning)"></div><div style="color:var(--text-muted);font-size:11px">--status-warning</div>
</div>
<div style="flex:1;display:flex;flex-direction:column;gap:6px">
<div style="height:64px;border-radius:8px;background:var(--status-danger)"></div><div style="color:var(--text-muted);font-size:11px">--status-danger</div>
</div>
<div style="flex:1;display:flex;flex-direction:column;gap:6px">
<div style="height:64px;border-radius:8px;background:var(--bg-glass);border:1px solid var(--border-subtle)"></div><div style="color:var(--text-muted);font-size:11px">--border-subtle</div>
</div>
<div style="flex:1;display:flex;flex-direction:column;gap:6px">
<div style="height:64px;border-radius:8px;background:var(--bg-glass);border:1px solid var(--border-accent)"></div><div style="color:var(--text-muted);font-size:11px">--border-accent</div>
</div>
</div>
