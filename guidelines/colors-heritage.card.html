<div style="flex:1;display:flex;flex-direction:column;gap:6px">
<div style="height:64px;border-radius:8px;background:var(--heritage-ultramarine)"></div><div style="color:var(--text-muted);font-size:11px">--heritage-ultramarine</div>
</div>
<div style="flex:1;display:flex;flex-direction:column;gap:6px">

</div>
